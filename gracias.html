<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>¡Gracias! · Buenos Aires Barbershop</title>
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/logo/favicon-96.png">
<style>
  @font-face{font-family:'Playfair Display';src:url('assets/fonts/PlayfairDisplay.woff2') format('woff2');font-weight:400 700;font-display:swap}
  @font-face{font-family:'Playfair Display';src:url('assets/fonts/PlayfairDisplay-Italic.woff2') format('woff2');font-weight:400 700;font-style:italic;font-display:swap}
  @font-face{font-family:'Helvetica Neue LT';src:url('assets/fonts/HelveticaNeueLT55.ttf') format('truetype');font-weight:100 500;font-display:swap}
  :root{--bg:#0a0908;--ink:#f7f3ef;--ink-dim:#9d8972;--copper:#b77636;--line:rgba(157,137,114,.18)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 120% at 50% 0%,#171109 0%,#0a0908 60%);
    color:var(--ink);font-family:'Helvetica Neue LT','Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
  .card{max-width:480px}
  .check{width:72px;height:72px;border-radius:50%;border:1px solid var(--copper);
    display:grid;place-items:center;margin:0 auto 28px;color:var(--copper)}
  .check svg{width:34px;height:34px}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(32px,5.6vw,50px);
    margin:0 0 14px;line-height:1.08}
  h1 em{font-style:italic;color:var(--copper)}
  p{color:var(--ink-dim);line-height:1.65;margin:0 0 14px}
  .home{display:inline-block;margin-top:22px;padding:14px 28px;border:1px solid var(--line);
    border-radius:2px;color:var(--ink);text-decoration:none;font-size:13px;
    letter-spacing:.12em;text-transform:uppercase;transition:border-color .3s,color .3s}
  .home:hover{border-color:var(--copper);color:var(--copper)}
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>¡Gracias por tu <em>regalo</em>!</h1>
    <p>Tu compra fue procesada. En cuanto se confirme el pago, le enviamos la gift card con su código directamente al email de quien la recibe.</p>
    <p>Si la pagaste con tarjeta, suele confirmarse en segundos. Por transferencia o efectivo puede tardar un poco más.</p>
    <a class="home" href="index.html">Volver a la casa</a>
  </div>
</body>
</html>
